global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: '25rp19824-turikumwenimana'
    environment: 'production'

scrape_configs:
  - job_name: 'api-service'
    static_configs:
      - targets: ['localhost:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'database'
    static_configs:
      - targets: ['localhost:5432']
    scrape_interval: 60s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - 'alerts.yml'
