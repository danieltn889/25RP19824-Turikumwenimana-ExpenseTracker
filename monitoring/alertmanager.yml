global:
  resolve_timeout: 5m

route:
  receiver: 'email'
  group_by: ['alertname', 'cluster']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  routes:
    - match:
        severity: critical
      receiver: 'email'
    - match:
        severity: warning
      receiver: 'email'

receivers:
  - name: 'email'
    webhook_configs:
      - url: 'http://localhost:5001/alert'

templates:
  - '/etc/alertmanager/templates/*.tmpl'
