                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Failed Stages:*\n${{ needs.code-quality.result == 'failure' && '❌ Stage 1a: Code Quality\n' || '' }}${{ needs.security-scan.result == 'failure' && '❌ Stage 1b: Security Scan\n' || '' }}${{ needs.test-code.result == 'failure' && '❌ Stage 2: Test Code\n' || '' }}${{ needs.build-and-test.result == 'failure' && '❌ Stage 3: Build & Integration Test\n' || '' }}${{ needs.build-and-push.result == 'failure' && '❌ Stage 4: Build & Push to Docker Hub\n' || '' }}${{ needs.deploy-application.result == 'failure' && '❌ Stage 5: Deploy Application\n' || '' }}"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*⚠️ Alert:*\nOne or more pipeline stages failed. Review logs and take corrective action."
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
