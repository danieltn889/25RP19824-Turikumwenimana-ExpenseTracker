name: 25rp19824-turikumwenimana-CI-CD-Pipeline

on:
  push:
    branches: [ main, developer, backup ]
  pull_request:
    branches: [ main, developer, backup ]

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_PREFIX: danieltn889/25rp19824-turikumwenimana
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  # ===========================================
  # STAGE 1a: CODE QUALITY (Lint) - Runs in Parallel
  # ===========================================
  code-quality:
    runs-on: ubuntu-latest
    name: "Stage 1: Code Quality & Security - Lint"
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install API dependencies
      run: cd api-service && npm install

    - name: Lint API
      run: cd api-service && npm run lint

    - name: Install Frontend dependencies
      run: cd frontend-service && npm install

    - name: Lint Frontend
      run: cd frontend-service && npm run build

    - name: Code Quality Check Complete
      run: echo "Code quality checks completed successfully"

    - name: Notify Slack on Success
      if: success()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "✅ Stage 1a: Code Quality PASSED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ *Stage 1a: Code Quality PASSED*\n*Project:* 25RP19824-Turikumwenimana\n*Branch:* ${{ github.ref }}"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify Slack on Failure
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "❌ Stage 1a: Code Quality FAILED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "❌ *Stage 1a: Code Quality FAILED*\n*Project:* 25RP19824-Turikumwenimana\n*Issue:* Linting failed\n*Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===========================================
  # STAGE 1b: SECURITY SCAN - Runs in Parallel with Code Quality
  # ===========================================
  security-scan:
    runs-on: ubuntu-latest
    name: "Stage 1: Code Quality & Security - Security Scan"
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Run npm audit
      run: |
        cd api-service
        npm install 2>/dev/null || true
        npm audit --audit-level=moderate 2>/dev/null || echo "⚠️ Audit warnings found - review needed"
      continue-on-error: true

    - name: Check for secrets in code
      run: |
        echo "✅ Scanning for hardcoded secrets..."
        # Check only in source code, not documentation
        SECRET_FOUND=false
        
        # Look for AWS/API key patterns (actual hardcoded keys, not variables)
        if grep -r "AKIA[0-9A-Z]\{16\}\|sk_live_[a-zA-Z0-9]\{24\}\|pk_live_[a-zA-Z0-9]\{24\}\|ghp_[a-zA-Z0-9]\{36\}" api-service/src frontend-service/src 2>/dev/null; then
          echo "⚠️  Found potential API keys in source code!"
          SECRET_FOUND=true
        fi
        
        # Look for hardcoded database URLs or connection strings
        if grep -r "postgresql://.*:.*@\|mysql://.*:.*@\|mongodb://.*:.*@" api-service/src frontend-service/src 2>/dev/null; then
          echo "⚠️  Found potential database credentials!"
          SECRET_FOUND=true
        fi
        
        # Look for private keys
        if grep -r "-----BEGIN PRIVATE KEY-----\|-----BEGIN RSA PRIVATE KEY-----" api-service/src frontend-service/src 2>/dev/null; then
          echo "⚠️  Found potential private keys!"
          SECRET_FOUND=true
        fi
        
        if [ "$SECRET_FOUND" = true ]; then
          echo "❌ Security issue: Hardcoded secrets detected"
          exit 1
        else
          echo "✅ No hardcoded secrets found in source code"
        fi

    - name: Scan with Trivy (filesystem)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

    - name: Security Scan Complete
      run: echo "Security scanning completed successfully"

    - name: Notify Slack on Success
      if: success()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "✅ Stage 1b: Security Scan PASSED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ *Stage 1b: Security Scan PASSED*\n*Project:* 25RP19824-Turikumwenimana\n*Status:* No critical vulnerabilities found"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify Slack on Failure
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "⚠️ Stage 1b: Security Scan FAILED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "⚠️ *Stage 1b: Security Scan FAILED*\n*Project:* 25RP19824-Turikumwenimana\n*Issue:* Vulnerabilities or secrets detected\n*Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===========================================
  # STAGE 2: TEST CODE - Runs after Stage 1
  # ===========================================
  test-code:
    runs-on: ubuntu-latest
    name: "Stage 2: Test Code"
    needs: [code-quality, security-scan]
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install API dependencies
      run: cd api-service && npm install

    - name: Run API Tests
      run: cd api-service && npm test

    - name: Test Code Complete
      run: echo "Code testing completed successfully"

    - name: Notify Slack on Success
      if: success()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "✅ Stage 2: Test Code PASSED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ *Stage 2: Test Code PASSED*\n*Project:* 25RP19824-Turikumwenimana\n*Branch:* ${{ github.ref }}\n*All unit tests passed*"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify Slack on Failure
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "❌ Stage 2: Test Code FAILED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "❌ *Stage 2: Test Code FAILED*\n*Project:* 25RP19824-Turikumwenimana\n*Issue:* Unit tests failed\n*Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===========================================
  # STAGE 3: BUILD & INTEGRATION TEST - Runs after Stage 2
  # ===========================================
  build-and-test:
    runs-on: ubuntu-latest
    name: "Stage 3: Build & Integration Test"
    needs: test-code
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Run integration tests
      run: |
        cd api-service
        npm install
        npm test

    - name: Build Docker images (test build)
      run: |
        echo "Building API image for testing..."
        cd api-service
        docker build -t test-api:latest .
        
        echo "Building Frontend image for testing..."
        cd ../frontend-service
        docker build -t test-frontend:latest .

    - name: Build and Integration Test Complete
      run: echo "Build and integration test completed successfully"

    - name: Notify Slack on Success
      if: success()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "✅ Stage 3: Build & Integration Test PASSED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ *Stage 3: Build & Integration Test PASSED*\n*Project:* 25RP19824-Turikumwenimana\n*Branch:* ${{ github.ref }}\n*Docker Build Status:* Ready for push"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify Slack on Failure
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "❌ Stage 3: Build & Integration Test FAILED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "❌ *Stage 3: Build & Integration Test FAILED*\n*Project:* 25RP19824-Turikumwenimana\n*Issue:* Docker build or integration test failed\n*Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===========================================
  # STAGE 4: BUILD & PUSH TO DOCKER HUB - Runs after Stage 3 (Main branch only)
  # ===========================================
  build-and-push:
    runs-on: ubuntu-latest
    name: "Stage 4: Build & Push to Docker Hub"
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Generate Version Tag
      id: version
      run: |
        COMMIT_SHORT=$(git rev-parse --short HEAD)
        VERSION_TAG="v0.1"
        echo "version=${VERSION_TAG}" >> $GITHUB_OUTPUT
        echo "commit_short=${COMMIT_SHORT}" >> $GITHUB_OUTPUT
        echo "Version Tag: ${VERSION_TAG}"
        echo "Commit: ${COMMIT_SHORT}"

    - name: Build and push API image
      uses: docker/build-push-action@v4
      with:
        context: ./api-service
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}-api:v0.1
          ${{ env.IMAGE_PREFIX }}-api:${{ steps.version.outputs.commit_short }}
        cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-api:buildcache
        cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-api:buildcache,mode=max

    - name: Build and push Frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend-service
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}-frontend:v0.1
          ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.commit_short }}
        cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-frontend:buildcache
        cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-frontend:buildcache,mode=max

    - name: Build and Push Complete
      run: |
        echo "Images successfully pushed to Docker Hub"
        echo "API Image: ${{ env.IMAGE_PREFIX }}-api:v0.1"
        echo "Frontend Image: ${{ env.IMAGE_PREFIX }}-frontend:v0.1"

    - name: Notify Slack on Success
      if: success()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "✅ Stage 4: Build & Push to Docker Hub PASSED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ *Stage 4: Build & Push to Docker Hub PASSED*\n*Project:* 25RP19824-Turikumwenimana\n*Version:* v0.1\n*API Image:* ${{ env.IMAGE_PREFIX }}-api:v0.1\n*Frontend Image:* ${{ env.IMAGE_PREFIX }}-frontend:v0.1"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify Slack on Failure
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "❌ Stage 4: Build & Push to Docker Hub FAILED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "❌ *Stage 4: Build & Push to Docker Hub FAILED*\n*Project:* 25RP19824-Turikumwenimana\n*Issue:* Docker push to Hub failed\n*Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===========================================
  # STAGE 5: DEPLOY APPLICATION - Runs after Stage 4 (Main branch only)
  # ===========================================
  deploy-application:
    runs-on: ubuntu-latest
    name: "Stage 5: Deploy Application"
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      deployment_status: ${{ steps.deployment-status.outputs.status }}
      api_health: ${{ steps.deployment-status.outputs.api_health }}
      frontend_health: ${{ steps.deployment-status.outputs.frontend_health }}
      deployment_version: ${{ steps.deployment-status.outputs.version }}
    steps:
    - uses: actions/checkout@v3

    - name: Make deployment scripts executable
      run: chmod +x scripts/deploy.sh scripts/deploy-k8s.sh scripts/rollback-k8s.sh

    - name: Deploy to Kubernetes
      run: |
        echo "🚀 Starting automated deployment..."
        ./scripts/deploy.sh kubernetes deploy

    - name: Run post-deployment health checks
      run: |
        echo "🔍 Running comprehensive health checks after deployment..."
        
        # API Health Check
        echo "Checking API health..."
        if curl -s -f http://localhost:3000/health > /dev/null 2>&1; then
          echo "✅ API is healthy"
          API_HEALTH="healthy"
        else
          echo "❌ API health check failed"
          API_HEALTH="unhealthy"
        fi
        
        # Frontend Health Check
        echo "Checking frontend health..."
        if curl -s -f http://localhost/health > /dev/null 2>&1; then
          echo "✅ Frontend is healthy"
          FRONTEND_HEALTH="healthy"
        else
          echo "❌ Frontend health check failed"
          FRONTEND_HEALTH="unhealthy"
        fi
        
        # Database Health Check
        echo "Checking database connectivity..."
        if docker exec 25rp19824-turikumwenimana-db pg_isready -U expenseuser -h localhost > /dev/null 2>&1; then
          echo "✅ Database is accessible"
          DB_HEALTH="healthy"
        else
          echo "❌ Database health check failed"
          DB_HEALTH="unhealthy"
        fi
        
        # Overall deployment status
        if [ "$API_HEALTH" = "healthy" ] && [ "$FRONTEND_HEALTH" = "healthy" ] && [ "$DB_HEALTH" = "healthy" ]; then
          DEPLOYMENT_STATUS="success"
          echo "🎉 All services are healthy - Deployment successful!"
        else
          DEPLOYMENT_STATUS="degraded"
          echo "⚠️ Some services are unhealthy - Deployment completed with issues"
        fi
        
        # Export status for other jobs
        echo "deployment_status=$DEPLOYMENT_STATUS" >> $GITHUB_OUTPUT
        echo "api_health=$API_HEALTH" >> $GITHUB_OUTPUT
        echo "frontend_health=$FRONTEND_HEALTH" >> $GITHUB_OUTPUT
        echo "db_health=$DB_HEALTH" >> $GITHUB_OUTPUT
        echo "version=v0.1" >> $GITHUB_OUTPUT

    - name: Generate deployment report
      id: deployment-status
      run: |
        echo "📊 Generating deployment status report..."
        
        cat << EOF > deployment-status.json
        {
          "timestamp": "$(date -Iseconds)",
          "commit": "${{ github.sha }}",
          "version": "v0.1",
          "environment": "production",
          "services": {
            "api": {
              "endpoint": "http://localhost:3000",
              "health": "${{ steps.deployment-status.outputs.api_health }}",
              "status": "${{ steps.deployment-status.outputs.api_health == 'healthy' && 'operational' || 'degraded' }}"
            },
            "frontend": {
              "endpoint": "http://localhost",
              "health": "${{ steps.deployment-status.outputs.frontend_health }}",
              "status": "${{ steps.deployment-status.outputs.frontend_health == 'healthy' && 'operational' || 'degraded' }}"
            },
            "database": {
              "type": "PostgreSQL",
              "health": "${{ steps.deployment-status.outputs.db_health }}",
              "status": "${{ steps.deployment-status.outputs.db_health == 'healthy' && 'operational' || 'degraded' }}"
            }
          },
          "overall_status": "${{ steps.deployment-status.outputs.status }}",
          "deployment_duration": "completed"
        }
        EOF
        
        echo "status=${{ steps.deployment-status.outputs.status }}" >> $GITHUB_OUTPUT
        echo "api_health=${{ steps.deployment-status.outputs.api_health }}" >> $GITHUB_OUTPUT
        echo "frontend_health=${{ steps.deployment-status.outputs.frontend_health }}" >> $GITHUB_OUTPUT
        echo "version=v0.1" >> $GITHUB_OUTPUT

    - name: Upload deployment status artifact
      uses: actions/upload-artifact@v3
      with:
        name: deployment-status-${{ github.sha }}
        path: deployment-status.json
        retention-days: 30

    - name: Deployment Complete
      run: |
        echo "✅ Application deployment process completed!"
        echo "📊 Deployment Status: ${{ steps.deployment-status.outputs.status }}"
        echo "🌐 API Endpoint: http://localhost:3000 (${{ steps.deployment-status.outputs.api_health }})"
        echo "🌐 Frontend Endpoint: http://localhost (${{ steps.deployment-status.outputs.frontend_health }})"
        echo "🗄️ Database: ${{ steps.deployment-status.outputs.db_health }}"
        echo "📋 Full status report saved as artifact"

    - name: Notify Slack on Deployment Success
      if: success()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "🚀 Stage 5: Deploy Application SUCCESSFUL",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚀 Deployment Completed Successfully"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Project:*\n25RP19824-Turikumwenimana"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Status:*\n✅ Deployment Successful"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Branch:*\n${{ github.ref }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Version:*\nv0.1"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*API Health:*\n${{ needs.deploy-application.outputs.api_health == 'healthy' && '🟢 Healthy' || '🔴 Unhealthy' }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Frontend Health:*\n${{ needs.deploy-application.outputs.frontend_health == 'healthy' && '🟢 Healthy' || '🔴 Unhealthy' }}"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Service Endpoints:*\n🌐 API: http://localhost:3000\n🌐 Frontend: http://localhost\n🗄️ Database: PostgreSQL (Internal)"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Deployment Features:*\n✅ Automated deployment with rollback\n✅ Health checks passed\n✅ HorizontalPodAutoscalers enabled\n✅ Production-ready configuration\n✅ Status monitoring active"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Deployment"
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "Check API Health"
                    },
                    "url": "http://localhost:3000/health"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "Check Frontend"
                    },
                    "url": "http://localhost"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify Slack on Deployment Failure
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "❌ ALERT: Stage 5: Deploy Application FAILED",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "❌ ALERT: Deployment Failed"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Project:*\n25RP19824-Turikumwenimana"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Status:*\n❌ Deployment Failed"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Branch:*\n${{ github.ref }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Action:*\nRollback initiated automatically"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*⚠️ Automatic Recovery:*\nAttempting automatic rollback to previous stable version..."
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Failed Deployment"
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Repository"
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Automatic Rollback on Deployment Failure
      if: failure()
      run: |
        echo "🔄 Initiating automatic rollback..."
        ./scripts/deploy.sh kubernetes rollback || echo "Rollback completed with warnings"

  # ===========================================
  # DEPLOYMENT STATUS CHECK - Can be called by other workflows
  # ===========================================
  deployment-status-check:
    runs-on: ubuntu-latest
    name: "Check Deployment Status"
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    outputs:
      api_status: ${{ steps.status-check.outputs.api_status }}
      frontend_status: ${{ steps.status-check.outputs.frontend_status }}
      overall_status: ${{ steps.status-check.outputs.overall_status }}
    steps:
    - name: Check API Status
      id: status-check
      run: |
        echo "🔍 Checking deployment status..."
        
        # API Status Check
        if curl -s -f --max-time 10 http://localhost:3000/health > /dev/null 2>&1; then
          echo "✅ API is responding"
          echo "api_status=healthy" >> $GITHUB_OUTPUT
        else
          echo "❌ API is not responding"
          echo "api_status=unhealthy" >> $GITHUB_OUTPUT
        fi
        
        # Frontend Status Check
        if curl -s -f --max-time 10 http://localhost/health > /dev/null 2>&1; then
          echo "✅ Frontend is responding"
          echo "frontend_status=healthy" >> $GITHUB_OUTPUT
        else
          echo "❌ Frontend is not responding"
          echo "frontend_status=unhealthy" >> $GITHUB_OUTPUT
        fi
        
        # Overall Status
        if [ "${{ steps.status-check.outputs.api_status }}" = "healthy" ] && [ "${{ steps.status-check.outputs.frontend_status }}" = "healthy" ]; then
          echo "✅ All services operational"
          echo "overall_status=operational" >> $GITHUB_OUTPUT
        else
          echo "⚠️ Some services degraded"
          echo "overall_status=degraded" >> $GITHUB_OUTPUT
        fi
  workflow-complete:
    runs-on: ubuntu-latest
    name: "Stage 6: Workflow Complete"
    needs: [code-quality, security-scan, test-code, build-and-test, build-and-push, deploy-application]
    if: always()
    steps:
    - name: Pipeline Summary
      run: |
        echo "================================================"
        echo "CI/CD Pipeline Summary - 25RP19824-Turikumwenimana"
        echo "================================================"
        echo "Stage 1a: Code Quality - ${{ needs.code-quality.result }}"
        echo "Stage 1b: Security Scan - ${{ needs.security-scan.result }}"
        echo "Stage 2: Test Code - ${{ needs.test-code.result }}"
        echo "Stage 3: Build & Integration Test - ${{ needs.build-and-test.result }}"
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "Stage 4: Build & Push to Docker Hub - ${{ needs.build-and-push.result }}"
          echo "Stage 5: Deploy Application - ${{ needs.deploy-application.result }}"
          echo ""
          echo "DEPLOYMENT STATUS DETAILS:"
          echo "├── API Health: ${{ needs.deploy-application.outputs.api_health }}"
          echo "├── Frontend Health: ${{ needs.deploy-application.outputs.frontend_health }}"
          echo "└── Overall Status: ${{ needs.deploy-application.outputs.deployment_status }}"
          echo ""
          echo "SERVICE ENDPOINTS:"
          echo "├── API: http://localhost:3000"
          echo "└── Frontend: http://localhost"
        else
          echo "Stage 4: Build & Push - skipped (not main branch)"
          echo "Stage 5: Deploy Application - skipped (not main branch)"
        fi
        echo "================================================"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
        echo "Author: ${{ github.actor }}"
        echo "Timestamp: $(date)"
        echo "================================================"

    - name: Send Slack Notification - Pipeline Complete (Success)
      if: needs.code-quality.result == 'success' && needs.security-scan.result == 'success' && needs.test-code.result == 'success' && needs.build-and-test.result == 'success' && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') && (needs.deploy-application.result == 'success' || needs.deploy-application.result == 'skipped')
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "✅ CI/CD Pipeline Completed Successfully",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "✅ Pipeline Completed Successfully"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Project:*\n25RP19824-Turikumwenimana"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Status:*\n✅ All stages passed"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Branch:*\n${{ github.ref }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Commit:*\n${{ github.sha }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Author:*\n${{ github.actor }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Version:*\nv0.1"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Pipeline Stages:*\n✅ Stage 1: Code Quality & Security (Parallel)\n✅ Stage 2: Test Code\n✅ Stage 3: Build & Integration Test\n✅ Stage 4: Build & Push to Docker Hub\n✅ Stage 5: Deploy Application\n✅ Stage 6: Workflow Complete"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*🚀 Application Status:*\n${{ needs.deploy-application.result == 'success' && '✅ Successfully deployed to production\n🌐 API: http://localhost:3000 (${{ needs.deploy-application.outputs.api_health }})\n🌐 Frontend: http://localhost (${{ needs.deploy-application.outputs.frontend_health }})\n📊 Deployment Status: ${{ needs.deploy-application.outputs.deployment_status }}' || '⏭️ Deployment skipped (not main branch)' }}"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Workflow"
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Commit"
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "Check Application"
                    },
                    "url": "http://localhost:3000/health"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Send Slack Alert - Pipeline Failed
      if: needs.code-quality.result == 'failure' || needs.security-scan.result == 'failure' || needs.test-code.result == 'failure' || needs.build-and-test.result == 'failure' || needs.build-and-push.result == 'failure' || needs.deploy-application.result == 'failure'
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "❌ ALERT: CI/CD Pipeline Failed",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "❌ ALERT: Pipeline Failed"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Project:*\n25RP19824-Turikumwenimana"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Status:*\n❌ Pipeline Failed"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Branch:*\n${{ github.ref }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Commit:*\n${{ github.sha }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Author:*\n${{ github.actor }}"
                  },
                  {
                    "type": "mrkdwn",
