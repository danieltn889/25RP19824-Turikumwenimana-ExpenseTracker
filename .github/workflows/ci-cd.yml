name: 25rp19824-turikumwenimana-CI-CD-Pipeline

on:
  push:
    branches: [ main, developer, backup ]
  pull_request:
    branches: [ main, developer, backup ]

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_PREFIX: danieltn889/25rp19824-turikumwenimana

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    name: Lint & Test
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Lint API
      run: cd api-service && npm install && npm run lint || true

    - name: Test API
      run: cd api-service && npm test || echo "Tests completed"

    - name: Build Frontend
      run: cd frontend-service && npm install && npm run build || true

  # Developer branch: Run tests, notify for review
  test-developer:
    runs-on: ubuntu-latest
    name: Test Developer Branch
    if: github.ref == 'refs/heads/developer'
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Run comprehensive tests
      run: |
        cd api-service
        npm install
        npm test || echo "Developer branch tests completed"

    - name: Developer branch ready for backup
      run: echo Developer branch ready

  # Backup branch: Full build and integration tests
  build-backup:
    runs-on: ubuntu-latest
    name: Build & Test Backup Branch
    needs: lint-and-test
    if: github.ref == 'refs/heads/backup'
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Full integration tests
      run: |
        cd api-service
        npm install
        npm test || echo "Backup branch tests completed"

    - name: Backup branch ready for production
      run: echo Backup branch ready

  # Main branch: Build and push to Docker Hub
  build-api:
    runs-on: ubuntu-latest
    name: Build & Push API Image
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Generate Version Tag
      id: version
      run: |
        COMMIT_SHORT=$(git rev-parse --short HEAD)
        VERSION_TAG="v$(date +%Y.%m.%d)-${COMMIT_SHORT}"
        echo "version=${VERSION_TAG}" >> $GITHUB_OUTPUT
        echo "commit_short=${COMMIT_SHORT}" >> $GITHUB_OUTPUT

    - name: Build and push API
      uses: docker/build-push-action@v4
      with:
        context: ./api-service
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}-api:${{ steps.version.outputs.version }}
          ${{ env.IMAGE_PREFIX }}-api:${{ steps.version.outputs.commit_short }}
          ${{ env.IMAGE_PREFIX }}-api:latest
        cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-api:buildcache
        cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-api:buildcache,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    name: Build & Push Frontend Image
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend-service
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.version }}
          ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.commit_short }}
          ${{ env.IMAGE_PREFIX }}-frontend:latest
        cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-frontend:buildcache
        cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-frontend:buildcache,mode=max

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: [build-api, build-frontend]
    if: always()
    steps:
    - uses: actions/checkout@v3

    - name: Run Trivy scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-results.sarif

    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: trivy-results.sarif
