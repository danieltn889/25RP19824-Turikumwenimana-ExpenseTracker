name: 25rp19824-turikumwenimana-CI-CD-Pipeline

on:
  push:
    branches: [ main, developer, backup ]
  pull_request:
    branches: [ main, developer, backup ]

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_PREFIX: danieltn889/25rp19824-turikumwenimana
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  # ===========================================
  # STAGE 1a: CODE QUALITY (Lint) - Runs in Parallel
  # ===========================================
  code-quality:
    runs-on: ubuntu-latest
    name: "Stage 1: Code Quality & Security - Lint"
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install API dependencies
      run: cd api-service && npm install

    - name: Lint API
      run: cd api-service && npm run lint

    - name: Install Frontend dependencies
      run: cd frontend-service && npm install

    - name: Lint Frontend
      run: cd frontend-service && npm run build

    - name: Code Quality Check Complete
      run: echo "Code quality checks completed successfully"

    - name: Notify Slack on Success
      if: success()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "✅ Stage 1a: Code Quality PASSED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ *Stage 1a: Code Quality PASSED*\n*Project:* 25RP19824-Turikumwenimana\n*Branch:* ${{ github.ref }}"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify Slack on Failure
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "❌ Stage 1a: Code Quality FAILED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "❌ *Stage 1a: Code Quality FAILED*\n*Project:* 25RP19824-Turikumwenimana\n*Issue:* Linting failed\n*Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===========================================
  # STAGE 1b: SECURITY SCAN - Runs in Parallel with Code Quality
  # ===========================================
  security-scan:
    runs-on: ubuntu-latest
    name: "Stage 1: Code Quality & Security - Security Scan"
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Run npm audit
      run: |
        cd api-service
        npm install 2>/dev/null || true
        npm audit --audit-level=moderate 2>/dev/null || echo "⚠️ Audit warnings found - review needed"
      continue-on-error: true

    - name: Check for secrets in code
      run: |
        if grep -r "password\|secret\|token\|key" *.json *.md 2>/dev/null | grep -v "node_modules"; then
          echo "Warning: Potential secrets found in code"
          exit 1
        else
          echo "No obvious secrets found"
        fi

    - name: Scan with Trivy (filesystem)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

    - name: Security Scan Complete
      run: echo "Security scanning completed successfully"

    - name: Notify Slack on Success
      if: success()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "✅ Stage 1b: Security Scan PASSED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ *Stage 1b: Security Scan PASSED*\n*Project:* 25RP19824-Turikumwenimana\n*Status:* No critical vulnerabilities found"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify Slack on Failure
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "⚠️ Stage 1b: Security Scan FAILED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "⚠️ *Stage 1b: Security Scan FAILED*\n*Project:* 25RP19824-Turikumwenimana\n*Issue:* Vulnerabilities or secrets detected\n*Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===========================================
  # STAGE 2: TEST CODE - Runs after Stage 1
  # ===========================================
  test-code:
    runs-on: ubuntu-latest
    name: "Stage 2: Test Code"
    needs: [code-quality, security-scan]
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install API dependencies
      run: cd api-service && npm install

    - name: Run API Tests
      run: cd api-service && npm test

    - name: Test Code Complete
      run: echo "Code testing completed successfully"

    - name: Notify Slack on Success
      if: success()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "✅ Stage 2: Test Code PASSED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ *Stage 2: Test Code PASSED*\n*Project:* 25RP19824-Turikumwenimana\n*Branch:* ${{ github.ref }}\n*All unit tests passed*"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify Slack on Failure
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "❌ Stage 2: Test Code FAILED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "❌ *Stage 2: Test Code FAILED*\n*Project:* 25RP19824-Turikumwenimana\n*Issue:* Unit tests failed\n*Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===========================================
  # STAGE 3: BUILD & INTEGRATION TEST - Runs after Stage 2
  # ===========================================
  build-and-test:
    runs-on: ubuntu-latest
    name: "Stage 3: Build & Integration Test"
    needs: test-code
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Run integration tests
      run: |
        cd api-service
        npm install
        npm test

    - name: Build Docker images (test build)
      run: |
        echo "Building API image for testing..."
        cd api-service
        docker build -t test-api:latest .
        
        echo "Building Frontend image for testing..."
        cd ../frontend-service
        docker build -t test-frontend:latest .

    - name: Build and Integration Test Complete
      run: echo "Build and integration test completed successfully"

    - name: Notify Slack on Success
      if: success()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "✅ Stage 3: Build & Integration Test PASSED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ *Stage 3: Build & Integration Test PASSED*\n*Project:* 25RP19824-Turikumwenimana\n*Branch:* ${{ github.ref }}\n*Docker Build Status:* Ready for push"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify Slack on Failure
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "❌ Stage 3: Build & Integration Test FAILED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "❌ *Stage 3: Build & Integration Test FAILED*\n*Project:* 25RP19824-Turikumwenimana\n*Issue:* Docker build or integration test failed\n*Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===========================================
  # STAGE 4: BUILD & PUSH TO DOCKER HUB - Runs after Stage 3 (Main branch only)
  # ===========================================
  build-and-push:
    runs-on: ubuntu-latest
    name: "Stage 4: Build & Push to Docker Hub"
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Generate Version Tag
      id: version
      run: |
        COMMIT_SHORT=$(git rev-parse --short HEAD)
        VERSION_TAG="v0.1"
        echo "version=${VERSION_TAG}" >> $GITHUB_OUTPUT
        echo "commit_short=${COMMIT_SHORT}" >> $GITHUB_OUTPUT
        echo "Version Tag: ${VERSION_TAG}"
        echo "Commit: ${COMMIT_SHORT}"

    - name: Build and push API image
      uses: docker/build-push-action@v4
      with:
        context: ./api-service
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}-api:v0.1
          ${{ env.IMAGE_PREFIX }}-api:${{ steps.version.outputs.commit_short }}
        cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-api:buildcache
        cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-api:buildcache,mode=max

    - name: Build and push Frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend-service
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}-frontend:v0.1
          ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.commit_short }}
        cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-frontend:buildcache
        cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-frontend:buildcache,mode=max

    - name: Build and Push Complete
      run: |
        echo "Images successfully pushed to Docker Hub"
        echo "API Image: ${{ env.IMAGE_PREFIX }}-api:v0.1"
        echo "Frontend Image: ${{ env.IMAGE_PREFIX }}-frontend:v0.1"

    - name: Notify Slack on Success
      if: success()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "✅ Stage 4: Build & Push to Docker Hub PASSED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ *Stage 4: Build & Push to Docker Hub PASSED*\n*Project:* 25RP19824-Turikumwenimana\n*Version:* v0.1\n*API Image:* ${{ env.IMAGE_PREFIX }}-api:v0.1\n*Frontend Image:* ${{ env.IMAGE_PREFIX }}-frontend:v0.1"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify Slack on Failure
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "❌ Stage 4: Build & Push to Docker Hub FAILED",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "❌ *Stage 4: Build & Push to Docker Hub FAILED*\n*Project:* 25RP19824-Turikumwenimana\n*Issue:* Docker push to Hub failed\n*Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===========================================
  # STAGE 5: WORKFLOW COMPLETE - Final summary
  # ===========================================
  workflow-complete:
    runs-on: ubuntu-latest
    name: "Stage 5: Workflow Complete"
    needs: [code-quality, security-scan, test-code, build-and-test, build-and-push]
    if: always()
    steps:
    - name: Pipeline Summary
      run: |
        echo "================================================"
        echo "CI/CD Pipeline Summary - 25RP19824-Turikumwenimana"
        echo "================================================"
        echo "Stage 1a: Code Quality - ${{ needs.code-quality.result }}"
        echo "Stage 1b: Security Scan - ${{ needs.security-scan.result }}"
        echo "Stage 2: Test Code - ${{ needs.test-code.result }}"
        echo "Stage 3: Build & Integration Test - ${{ needs.build-and-test.result }}"
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "Stage 4: Build & Push to Docker Hub - ${{ needs.build-and-push.result }}"
        else
          echo "Stage 4: Build & Push - skipped (not main branch)"
        fi
        echo "================================================"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
        echo "Author: ${{ github.actor }}"
        echo "================================================"

    - name: Send Slack Notification - Pipeline Complete (Success)
      if: needs.code-quality.result == 'success' && needs.security-scan.result == 'success' && needs.test-code.result == 'success' && needs.build-and-test.result == 'success' && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "✅ CI/CD Pipeline Completed Successfully",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "✅ Pipeline Completed Successfully"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Project:*\n25RP19824-Turikumwenimana"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Status:*\n✅ All stages passed"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Branch:*\n${{ github.ref }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Commit:*\n${{ github.sha }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Author:*\n${{ github.actor }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Version:*\nv0.1"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Pipeline Stages:*\n✅ Stage 1: Code Quality & Security (Parallel)\n✅ Stage 2: Test Code\n✅ Stage 3: Build & Integration Test\n✅ Stage 4: Build & Push to Docker Hub\n✅ Stage 5: Workflow Complete"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Workflow"
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Commit"
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Send Slack Alert - Pipeline Failed
      if: needs.code-quality.result == 'failure' || needs.security-scan.result == 'failure' || needs.test-code.result == 'failure' || needs.build-and-test.result == 'failure' || needs.build-and-push.result == 'failure'
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "❌ ALERT: CI/CD Pipeline Failed",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "❌ ALERT: Pipeline Failed"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Project:*\n25RP19824-Turikumwenimana"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Status:*\n❌ Pipeline Failed"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Branch:*\n${{ github.ref }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Commit:*\n${{ github.sha }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Author:*\n${{ github.actor }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Action:*\nImmediate Review Required"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Failed Stages:*\n${{ needs.code-quality.result == 'failure' && '❌ Stage 1a: Code Quality\n' || '' }}${{ needs.security-scan.result == 'failure' && '❌ Stage 1b: Security Scan\n' || '' }}${{ needs.test-code.result == 'failure' && '❌ Stage 2: Test Code\n' || '' }}${{ needs.build-and-test.result == 'failure' && '❌ Stage 3: Build & Integration Test\n' || '' }}${{ needs.build-and-push.result == 'failure' && '❌ Stage 4: Build & Push to Docker Hub\n' || '' }}"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*⚠️ Alert:*\nOne or more pipeline stages failed. Review logs and take corrective action."
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Failed Workflow"
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Repository"
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}