version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: 25rp19824-turikumwenimana-db
    environment:
      POSTGRES_USER: ${DB_USER:-expenseuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-expensepass}
      POSTGRES_DB: ${DB_NAME:-expensedb}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-expenseuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - 25rp19824-network
    restart: unless-stopped

  api:
    build: ./api-service
    container_name: 25rp19824-turikumwenimana-api
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-expenseuser}
      DB_PASSWORD: ${DB_PASSWORD:-expensepass}
      DB_NAME: ${DB_NAME:-expensedb}
      DB_PORT: 5432
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - 25rp19824-network
    restart: unless-stopped

  frontend:
    build: ./frontend-service
    container_name: 25rp19824-turikumwenimana-frontend
    ports:
      - "80:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - 25rp19824-network
    restart: unless-stopped

volumes:
  db_data:
    driver: local

networks:
  25rp19824-network:
    driver: bridge
