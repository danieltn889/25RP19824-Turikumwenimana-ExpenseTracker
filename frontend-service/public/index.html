<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker - 25RP19824-Turikumwenimana</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    /* ============= LOGIN PAGE ============= */
    #loginPage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .login-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      color: #333;
      font-size: 26px;
      margin-bottom: 8px;
    }

    .login-header p {
      color: #667eea;
      font-size: 12px;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      color: #555;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .form-toggle {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: #666;
    }

    .form-toggle a {
      color: #667eea;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
    }

    .form-toggle a:hover {
      text-decoration: underline;
    }

    /* ============= DASHBOARD ============= */
    #dashboardPage {
      display: none;
    }

    .dashboard {
      max-width: 1200px;
      margin: 0 auto;
      animation: slideUp 0.3s ease;
    }

    .navbar {
      background: white;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .navbar h2 {
      color: #333;
      font-size: 20px;
    }

    .navbar-right {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .user-info {
      color: #666;
      font-size: 13px;
    }

    .logout-btn {
      background: #ff6b6b;
      padding: 8px 15px;
      font-size: 13px;
      width: auto;
    }

    .logout-btn:hover {
      background: #ff5252;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .card h3 {
      color: #333;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .add-expense {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .add-expense input,
    .add-expense select {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
    }

    .add-expense button {
      grid-column: 1 / -1;
      padding: 10px;
    }

    .expense-item {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #667eea;
    }

    .expense-info {
      flex: 1;
    }

    .expense-desc {
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    .expense-category {
      color: #999;
      font-size: 12px;
    }

    .expense-amount {
      font-weight: bold;
      color: #764ba2;
      font-size: 16px;
    }

    .expense-delete {
      background: #ff6b6b;
      padding: 6px 12px;
      font-size: 12px;
      width: auto;
      margin-left: 10px;
    }

    .summary-item {
      padding: 12px;
      margin-bottom: 10px;
      background: #f8f9fa;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
    }

    .summary-label {
      color: #666;
      font-weight: 600;
    }

    .summary-value {
      color: #667eea;
      font-weight: bold;
    }

    .error {
      background: #ffe0e0;
      color: #c00;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    .success {
      background: #e0ffe0;
      color: #0a0;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 40px 20px;
    }

    @media (max-width: 768px) {
      .content-grid {
        grid-template-columns: 1fr;
      }

      .add-expense {
        grid-template-columns: 1fr;
      }

      .navbar {
        flex-direction: column;
        gap: 10px;
      }

      .navbar h2 {
        width: 100%;
      }

      .navbar-right {
        width: 100%;
        flex-wrap: wrap;
      }

      .expense-item {
        flex-direction: column;
      }

      .expense-delete {
        width: 100%;
        margin-left: 0;
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>

<!-- ============= LOGIN PAGE ============= -->
<div id="loginPage">
  <div class="login-container">
    <div class="login-header">
      <h1>Expense Tracker</h1>
      <p>25RP19824-Turikumwenimana</p>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUsername" placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password">
      </div>
      <button onclick="handleLogin()">Login</button>
      <div class="form-toggle">
        Don't have account? <a onclick="toggleForm()">Sign Up</a>
      </div>
    </div>

    <!-- Signup Form -->
    <div id="signupForm" style="display:none;">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="signupUsername" placeholder="Choose username">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="Enter email">
      </div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signupFullName" placeholder="Enter full name">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Create password">
      </div>
      <button onclick="handleSignup()">Sign Up</button>
      <div class="form-toggle">
        Already have account? <a onclick="toggleForm()">Login</a>
      </div>
    </div>

    <div id="authError"></div>
  </div>
</div>

<!-- ============= DASHBOARD PAGE ============= -->
<div id="dashboardPage">
  <div class="dashboard">
    <!-- Navbar -->
    <div class="navbar">
      <h2>💰 Expense Tracker</h2>
      <div class="navbar-right">
        <div class="user-info" id="userInfo"></div>
        <button class="logout-btn" onclick="handleLogout()">Logout</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="content-grid">
      <!-- Add Expense -->
      <div class="card">
        <h3>Add New Expense</h3>
        <div id="addError"></div>
        <div class="add-expense">
          <input type="text" id="description" placeholder="Description (e.g., Lunch)">
          <input type="number" id="amount" placeholder="Amount" step="0.01">
          <select id="category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Utilities">Utilities</option>
            <option value="Other">Other</option>
          </select>
          <button onclick="addExpense()">Add Expense</button>
        </div>

        <h3>Recent Expenses</h3>
        <div id="expensesList"></div>
      </div>

      <!-- Summary -->
      <div class="card">
        <h3>Summary</h3>
        <div id="summary"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_BASE = '/api/v1';
  let currentUser = null;
  let currentToken = null;

  // Check if already logged in
  window.addEventListener('load', () => {
    const saved = localStorage.getItem('expenseTrackerUser');
    if (saved) {
      const { user, token } = JSON.parse(saved);
      currentUser = user;
      currentToken = token;
      showDashboard();
    }
  });

  function toggleForm() {
    document.getElementById('loginForm').style.display = document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none';
    document.getElementById('signupForm').style.display = document.getElementById('signupForm').style.display === 'none' ? 'block' : 'none';
    document.getElementById('authError').innerHTML = '';
  }

  async function handleLogin() {
    const username = document.getElementById('loginUsername').value;
    const password = document.getElementById('loginPassword').value;

    if (!username || !password) {
      showError('authError', 'Please fill all fields');
      return;
    }

    try {
      const response = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await response.json();
      
      if (!response.ok) {
        showError('authError', data.message || 'Login failed');
        return;
      }

      currentUser = data.user;
      currentToken = data.token;
      localStorage.setItem('expenseTrackerUser', JSON.stringify({ user: data.user, token: data.token }));
      
      showDashboard();
    } catch (err) {
      showError('authError', 'Connection error: ' + err.message);
    }
  }

  async function handleSignup() {
    const username = document.getElementById('signupUsername').value;
    const email = document.getElementById('signupEmail').value;
    const fullName = document.getElementById('signupFullName').value;
    const password = document.getElementById('signupPassword').value;

    if (!username || !email || !fullName || !password) {
      showError('authError', 'Please fill all fields');
      return;
    }

    try {
      const response = await fetch(`${API_BASE}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, fullName, password })
      });

      const data = await response.json();

      if (!response.ok) {
        showError('authError', data.message || 'Signup failed');
        return;
      }

      currentUser = data.user;
      currentToken = data.token;
      localStorage.setItem('expenseTrackerUser', JSON.stringify({ user: data.user, token: data.token }));
      
      showDashboard();
    } catch (err) {
      showError('authError', 'Connection error: ' + err.message);
    }
  }

  function showDashboard() {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('dashboardPage').style.display = 'block';
    document.getElementById('userInfo').textContent = `👤 ${currentUser.username}`;
    loadExpenses();
    loadSummary();
  }

  async function addExpense() {
    const description = document.getElementById('description').value;
    const amount = document.getElementById('amount').value;
    const category = document.getElementById('category').value;

    if (!description || !amount) {
      showError('addError', 'Please fill all fields');
      return;
    }

    try {
      const response = await fetch(`${API_BASE}/expenses`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${currentToken}`
        },
        body: JSON.stringify({ description, amount: parseFloat(amount), category })
      });

      if (!response.ok) {
        const error = await response.json();
        showError('addError', error.message || 'Failed to add expense');
        return;
      }

      document.getElementById('description').value = '';
      document.getElementById('amount').value = '';
      loadExpenses();
      loadSummary();
      showSuccess('addError', 'Expense added successfully!');
    } catch (err) {
      showError('addError', 'Error: ' + err.message);
    }
  }

  async function loadExpenses() {
    try {
      const response = await fetch(`${API_BASE}/expenses`, {
        headers: { 'Authorization': `Bearer ${currentToken}` }
      });

      if (!response.ok) throw new Error('Failed to load expenses');

      const data = await response.json();
      const expenses = Array.isArray(data) ? data : (data.expenses || []);

      let html = '';
      if (expenses.length === 0) {
        html = '<div class="empty-state">No expenses yet. Add one to get started!</div>';
      } else {
        expenses.forEach(exp => {
          html += `
            <div class="expense-item">
              <div class="expense-info">
                <div class="expense-desc">${exp.description}</div>
                <div class="expense-category">${exp.category}</div>
              </div>
              <div class="expense-amount">$${parseFloat(exp.amount).toFixed(2)}</div>
              <button class="expense-delete" onclick="deleteExpense('${exp.id}')">Delete</button>
            </div>
          `;
        });
      }

      document.getElementById('expensesList').innerHTML = html;
    } catch (err) {
      console.error('Error loading expenses:', err);
    }
  }

  async function deleteExpense(id) {
    if (!confirm('Delete this expense?')) return;

    try {
      const response = await fetch(`${API_BASE}/expenses/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${currentToken}` }
      });

      if (!response.ok) throw new Error('Failed to delete');
      
      loadExpenses();
      loadSummary();
    } catch (err) {
      showError('addError', 'Error deleting expense');
    }
  }

  async function loadSummary() {
    try {
      // Fetch all expenses and calculate summary
      const response = await fetch(`${API_BASE}/expenses`, {
        headers: { 'Authorization': `Bearer ${currentToken}` }
      });

      if (!response.ok) throw new Error('Failed to load expenses');

      const data = await response.json();
      const expenses = Array.isArray(data) ? data : (data.expenses || []);
      
      // Calculate summary from expenses
      let total = 0;
      expenses.forEach(expense => {
        total += parseFloat(expense.amount || 0);
      });
      
      const count = expenses.length;
      const avg = count > 0 ? (total / count).toFixed(2) : '0.00';

      document.getElementById('summary').innerHTML = `
        <div class="summary-item">
          <span class="summary-label">Total Expenses</span>
          <span class="summary-value">$${total.toFixed(2)}</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Number of Expenses</span>
          <span class="summary-value">${count}</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Average Expense</span>
          <span class="summary-value">$${avg}</span>
        </div>
      `;
    } catch (err) {
      console.error('Error loading summary:', err);
      document.getElementById('summary').innerHTML = `
        <div class="summary-item">
          <span class="summary-label">Total Expenses</span>
          <span class="summary-value">$0.00</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Number of Expenses</span>
          <span class="summary-value">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Average Expense</span>
          <span class="summary-value">$0.00</span>
        </div>
      `;
    }
  }

  function handleLogout() {
    if (!confirm('Logout?')) return;
    currentUser = null;
    currentToken = null;
    localStorage.removeItem('expenseTrackerUser');
    
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('dashboardPage').style.display = 'none';
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('signupForm').style.display = 'none';
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
  }

  function showError(elementId, message) {
    const el = document.getElementById(elementId);
    el.innerHTML = `<div class="error">${message}</div>`;
  }

  function showSuccess(elementId, message) {
    const el = document.getElementById(elementId);
    el.innerHTML = `<div class="success">${message}</div>`;
    setTimeout(() => { el.innerHTML = ''; }, 3000);
  }
</script>

</body>
</html>
