apiVersion: apps/v1
kind: Deployment
metadata:
  name: turikumwenimana-frontend
  namespace: 25rp19824-turikumwenimana
  labels:
    app: turikumwenimana-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: turikumwenimana-frontend
  template:
    metadata:
      labels:
        app: turikumwenimana-frontend
        version: v1
    spec:
      containers:
      - name: frontend
        image: danieltn889/25rp19824-turikumwenimana-frontend:v0.2
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: turikumwenimana-frontend
  namespace: 25rp19824-turikumwenimana
  labels:
    app: turikumwenimana-frontend
spec:
  type: LoadBalancer
  selector:
    app: turikumwenimana-frontend
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
